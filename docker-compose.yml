version: '3.8'

services:
  whisper-api:
    build: .
    container_name: whisper-api
    ports:
      - "8000:8000"
    volumes:
      - ./server.py:/app/server.py  # Monta el código fuente
      - ./venv/lib/python3.12:/app/venv/lib/python3.12  # Monta el entorno virtual
      #- ./venv/bin/uvicorn:/app/venv/bin/uvicorn  # Monta el ejecutable de Uvicorn
      #- ./pyvenv.cfg:/app/venv/pyvenv.cfg  # Monta la configuración del entorno virtual adecuado
    restart: always
    #restart: no
    #command: ["tail", "-f", "/dev/null"]
    #command: ["./venv/bin/uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000"]
    # entrypoint: ["/bin/bash", "-c"]
    entrypoint: ["/bin/bash", "-c", "export PATH=/app/venv/bin:$PATH && exec $0 \"$@\"", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
